# Optional local Postgres + pgvector (needs Docker Desktop on Windows). Not required if you
# use Supabase or Neon. Creates two databases: `nocturne` (dev) and `nocturne_test` (tests).
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nocturne
      POSTGRES_PASSWORD: nocturne
      POSTGRES_DB: nocturne
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocturne"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
