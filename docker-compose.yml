# Optional local Postgres + pgvector (needs Docker Desktop on Windows). Not required if you
# use Supabase or Neon. Creates `nocturne` (dev), `nocturne_test` (tests)
# and `nocturne_eval` (eval harness). The init script only runs on a fresh volume; on an
# existing one: docker compose exec db createdb -U nocturne nocturne_eval
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: nocturne
      POSTGRES_PASSWORD: nocturne
      POSTGRES_DB: nocturne
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/initdb:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nocturne"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  pgdata:
