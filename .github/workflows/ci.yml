name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: nocturne_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/nocturne_test
      # Non-UTC DB sessions: psycopg returns timestamps in the session zone, and we once
      # mislabelled those as UTC. Keep testing the non-default case.
      PGTZ: America/Chicago
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: ruff check . && ruff format --check .
      - run: pytest -q
      # Eval harness (repo root: ruff.toml + pytest.ini), incl. an offline end-to-end run.
      - run: ruff check . && ruff format --check .
        working-directory: .
      - run: pytest -q eval/tests
        working-directory: .

  # The dev machine is Windows: catch event-loop and path issues that Linux CI can't see.
  backend-windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/pyproject.toml
      - run: pip install -e ".[dev]"
      - run: pytest -q tests/unit
      - run: pytest -q eval/tests  # end-to-end test skips without a database
        working-directory: .
