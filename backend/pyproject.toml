[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "nocturne-backend"
version = "0.2.0"
description = "Nocturne: a sleep-time memory agent"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.36",  # 0.36+ accepts a custom --loop factory
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary,pool]>=3.2",
    "pgvector>=0.3",
    "numpy>=1.26",
    "httpx>=0.27",
    "pyjwt[crypto]>=2.8",  # Supabase Auth tokens (ES256/RS256)
    "tenacity>=8.3",
    "langfuse>=3.0",
    "langgraph>=1.0",
    "langgraph-checkpoint-postgres>=3.0",
]

[project.optional-dependencies]
# Real embeddings: ONNX Runtime, no torch. Prebuilt wheels for Windows; no compiler needed.
embeddings = ["fastembed>=0.4"]
dev = ["pytest>=8", "pytest-asyncio>=0.23", "ruff>=0.5"]

[tool.setuptools.packages.find]
include = ["app*", "scripts*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC"]
